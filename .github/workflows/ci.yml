name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Node 22's bundled npm 10.9.8 crashes on lockfile-less installs (npm/cli#9787)
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm test
